kind = "web"
previewPath = "/torqueshed-staging/"
title = "TorqueShed (staging)"
version = "1.0.0"
id = "artifacts/torqueshed-staging"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/torqueshed-staging/" ]
localPort = 22036

[services.development]
run = "pnpm --filter @workspace/torqueshed-staging run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/torqueshed-staging", "run", "build" ]
publicDir = "artifacts/torqueshed-staging/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22036"
BASE_PATH = "/torqueshed-staging/"
