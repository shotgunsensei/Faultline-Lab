kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/sso"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.development.env]
# Enable the test-only auth bypass used by the scripted Stripe purchase E2E
# (`scripts/src/test-stripe-flow.ts`, run via the `stripe-e2e` validation).
# Hard-disabled in production by requireAuth.ts (REPLIT_DEPLOYMENT=1 check)
# even if this value leaked into a production env.
ENABLE_E2E_AUTH_BYPASS = "1"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
